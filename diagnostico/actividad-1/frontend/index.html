<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Planta de Reciclaje</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btnVerStock">Stock</button>
    <button id="btnAgregarMaterial">Agregar Material</button>
    <button id="btnCompra">Comprar</button>
    <button id="btnVenta">Venta</button>
    <table>
        <thead>
            <tr>
                <th colspan="5">Planta de Reciclaje SRL.</th>
            </tr>
            <tr>
                <th>id</th>
                <th>material</th>
                <th>medida</th>
                <th>cantidad</th>
                <th>precio unitario</th>
            </tr>
        </thead>
        <tbody id="tablaStock">
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Total:</td>
                <td id="totalStock">$0</td>
            </tr>
        </tfoot>
    </table>
   
    <div id="modal">
        <div id="modalContenido">
            <h2 id="modalTitulo"></h2>
            <div id="modalFormulario"></div>
            <button id="btnConfirmar">Confirmar</button>
            <button id="btnCancelar">Cancelar</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
