<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
    </head>
    <body>
        <h1>Registro de usuarios</h1>
        <form id="form-register">
            <label>Usuario:</label>
            <input id="r-username" required><br>
            <label>Password:</label>
            <input id="r-password" type="password" required><br>
            <button type="submit">Crear usuario</button>
        </form>
        <p id="register-result"></p>

        <hr>

        <h1>Iniciar sesión</h1>
        <form id="form-login">
            <label>Usuario:</label>
            <input id="l-username" required><br>
            <label>Password:</label>
            <input id="l-password" type="password" required><br>
            <button type="submit">Ingresar</button>
        </form>
        <p id="login-result"></p>

        <hr>

        <h1>Autorizador</h1>
        <p>Usuario activo: <span id="active-user">-</span></p>
        <button id="btn-log">Ejecutar /log</button>
        <button id="btn-sayhello">Ejecutar /sayHello</button>
        <p id="authorize-result"></p>

        <hr>

        <button id="btnMsg">Mostrar mensaje en el servidor</button>
    </body>

    <script>

    let logged_username = null;

    // ── Hash SHA256 en el frontend ────────────────────────────────────────────
    // El profe indicó que el hash se hace del lado del cliente.
    // La contraseña en texto plano nunca llega al servidor.

    async function calcularHashSHA256(cadena)
    {
        const encoder    = new TextEncoder();
        const data       = encoder.encode(cadena);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        const hashHex    = hashArray.map(function(byte) { return byte.toString(16).padStart(2, '0'); }).join('');
        return hashHex;
    }

    // ── Registro ──────────────────────────────────────────────────────────────

    document.getElementById('form-register').addEventListener('submit', async function(e)
    {
        e.preventDefault();

        const username      = document.getElementById('r-username').value;
        const password      = document.getElementById('r-password').value;
        const password_hash = await calcularHashSHA256(password);

        const body = new URLSearchParams({ username: username, password_hash: password_hash });

        const res  = await fetch('/register', { method: 'POST', body: body });
        const data = await res.json();

        if (data.error)
        {
            document.getElementById('register-result').textContent = 'Error: ' + data.error;
        }
        else
        {
            document.getElementById('register-result').textContent = 'Usuario creado: ' + data.username;
        }
    });

    // ── Login ─────────────────────────────────────────────────────────────────

    document.getElementById('form-login').addEventListener('submit', async function(e)
    {
        e.preventDefault();

        const username      = document.getElementById('l-username').value;
        const password      = document.getElementById('l-password').value;
        const password_hash = await calcularHashSHA256(password);

        const res  = await fetch('/login',
        {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ username: username, password_hash: password_hash })
        });

        const data = await res.json();

        if (data.session && data.session.status === 'enabled')
        {
            logged_username = username;
            document.getElementById('active-user').textContent  = username;
            document.getElementById('login-result').textContent = 'Sesión iniciada: ' + username;
        }
        else
        {
            document.getElementById('login-result').textContent = 'Usuario o contraseña incorrectos.';
        }
    });

    // ── Autorizador ───────────────────────────────────────────────────────────

    function checkAuthorize(path)
    {
        if (!logged_username)
        {
            document.getElementById('authorize-result').textContent = 'Primero iniciá sesión.';
            return;
        }

        fetch('/authorize?username=' + encodeURIComponent(logged_username) + '&path=' + encodeURIComponent(path))
        .then(function(res)  { return res.json(); })
        .then(function(data)
        {
            if (data.error)
            {
                document.getElementById('authorize-result').textContent = 'Error: ' + data.error;
                return;
            }

            document.getElementById('authorize-result').textContent =
                logged_username + (data.allowed ? ' tiene permiso sobre ' : ' NO tiene permiso sobre ') + path;
        });
    }

    function onBtnLogOnClick()
    {
        checkAuthorize('/log');
    }

    function onBtnSayHelloOnClick()
    {
        checkAuthorize('/sayHello');
    }

    function onBtnMsgOnClick()
    {
        console.log('Enviando petición al servidor...');
        fetch('/showMessage');
    }

    function main()
    {
        document.getElementById('btn-log').onclick      = onBtnLogOnClick;
        document.getElementById('btn-sayhello').onclick = onBtnSayHelloOnClick;
        document.getElementById('btnMsg').onclick       = onBtnMsgOnClick;
    }

    window.onload = main;

    </script>
</html>
