<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>SDK v5</title>
        <script type="module" src="./WCLoginFormView.js"></script>
        <script type="module" src="./WCRegisterFormView.js"></script>
    </head>
    <body>

        <wc-register-form-view></wc-register-form-view>

        <hr>

        <wc-login-form-view></wc-login-form-view>

        <hr>

        <h1>Autorizador</h1>
        <p>Usuario activo: <span id="active-user">-</span></p>
        <button id="btn-log">Ejecutar /log</button>
        <button id="btn-sayhello">Ejecutar /sayHello</button>
        <p id="authorize-result"></p>

        <hr>

        <button id="btnMsg">Mostrar mensaje en el servidor</button>

    </body>

    <script>

    let userId = null;
    let key    = null;

    // ── Dominio ───────────────────────────────────────────────────────────────

    function getPrcaDominio()
    {
        return 'http://127.0.0.1:8080';
    }

    // ── Headers RPC ───────────────────────────────────────────────────────────

    function getRpcApiHeaders()
    {
        let headers =
        {
            'Content-Type': 'application/json',
            'x-user-id':    userId,
            'x-api-key':    key
        };
        return headers;
    }

    // ── Clases de excepción ───────────────────────────────────────────────────

    class SpecificationError extends Error
    {
        constructor(detail)
        {
            super('SpecificationError');
            this.detail = detail;
        }
    }

    class UnauthorizedError extends Error
    {
        constructor(detail)
        {
            super('UnauthorizedError');
            this.detail = detail;
        }
    }

    class DomainError extends Error
    {
        constructor(detail)
        {
            super('DomainError');
            this.detail = detail;
        }
    }

    class ServerError extends Error
    {
        constructor(detail)
        {
            super('ServerError');
            this.detail = detail;
        }
    }

    // ── RPCWebAPIFetch ────────────────────────────────────────────────────────

    async function RPCWebAPIFetch(name, content)
    {
        try
        {
            const req = await fetch(getPrcaDominio() + '/' + name,
            {
                method:  'POST',
                headers: getRpcApiHeaders(),
                body:    JSON.stringify(content)
            });

            switch (req.status)
            {
                case 200:
                    return await req.json();

                case 400:
                    throw new SpecificationError(await req.json());

                case 401:
                    throw new UnauthorizedError(await req.json());

                case 422:
                    throw new DomainError(await req.json());

                case 500:
                    throw new ServerError(await req.json());

                default:
                    throw new SpecificationError({ exception: 'UnexpectedStatus', detail: [req.status] });
            }
        }
        catch (err)
        {
            if (err instanceof SpecificationError ||
                err instanceof UnauthorizedError  ||
                err instanceof DomainError        ||
                err instanceof ServerError)
            {
                throw err;
            }
            throw new ServerError({ exception: 'NetworkError', detail: [err.message] });
        }
    }

    // ── Hash SHA256 en el frontend ────────────────────────────────────────────

    async function calcularHashSHA256(cadena)
    {
        const encoder    = new TextEncoder();
        const data       = encoder.encode(cadena);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        const hashHex    = hashArray.map(function(byte) { return byte.toString(16).padStart(2, '0'); }).join('');
        return hashHex;
    }

    // ── Evento unificado de los WebComponents ─────────────────────────────────

    document.addEventListener('request', async function(e)
    {
        if (e.detail.action === 'register')
        {
            userId = e.detail.username;
            key    = await calcularHashSHA256(e.detail.password);

            try
            {
                const res = await RPCWebAPIFetch('register', {});
                alert('Usuario creado: ' + res.username);
            }
            catch (err)
            {
                console.error(err);
                alert('Error: ' + err.message);
            }
        }

        if (e.detail.action === 'login')
        {
            userId = e.detail.username;
            key    = await calcularHashSHA256(e.detail.password);

            try
            {
                const res = await RPCWebAPIFetch('login', {});

                if (res.session && res.session.status === 'enabled')
                {
                    document.getElementById('active-user').innerText = userId;
                }
            }
            catch (err)
            {
                console.error(err);

                if (err instanceof UnauthorizedError)
                {
                    alert('Usuario o contraseña incorrectos.');
                }
                else
                {
                    alert('Error: ' + err.message);
                }
            }
        }
    });

    // ── Autorizador ───────────────────────────────────────────────────────────

    async function checkAuthorize(path)
    {
        if (!userId)
        {
            document.getElementById('authorize-result').innerText = 'Primero iniciá sesión.';
            return;
        }

        try
        {
            const res = await RPCWebAPIFetch('authorize', { path: path });
            document.getElementById('authorize-result').innerText =
                userId + (res.allowed ? ' tiene permiso sobre ' : ' NO tiene permiso sobre ') + path;
        }
        catch (err)
        {
            console.error(err);
            document.getElementById('authorize-result').innerText = 'Error: ' + err.message;
        }
    }

    function onBtnLogOnClick()
    {
        checkAuthorize('/log');
    }

    function onBtnSayHelloOnClick()
    {
        checkAuthorize('/sayHello');
    }

    function onBtnMsgOnClick()
    {
        RPCWebAPIFetch('showMessage', {}).catch(function(err) { console.error(err); });
    }

    function main()
    {
        document.getElementById('btn-log').onclick      = onBtnLogOnClick;
        document.getElementById('btn-sayhello').onclick = onBtnSayHelloOnClick;
        document.getElementById('btnMsg').onclick       = onBtnMsgOnClick;
    }

    window.onload = main;

    </script>
</html>
