<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>SDK v5</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
        <link rel="stylesheet" href="./assets/icons/font-awesome-4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="./assets/css/w3pro-4.13.css">
        <link rel="stylesheet" href="./assets/css/w3-theme.css">
        <link rel="stylesheet" href="./assets/css/admin-styles.css">
        <script type="module" src="./WCLoginFormView.js"></script>
        <script type="module" src="./WCRegisterFormView.js"></script>
    </head>
    <body>

        <wc-login-form-view
            logo-src="./assets/admin-logo.png"
            logo-alt="Logo"
            title="Bienvenido"
            register-url="register.html"
            button-text="Ingresar">
        </wc-login-form-view>

        <hr>

        <wc-register-form-view></wc-register-form-view>

        <hr>

        <h3>Pruebas de Autorización (RPC - POST)</h3>
        <p>Usuario activo: <span id="active-user">-</span></p>
        <button id="btn-log">Ejecutar /log</button>
        <button id="btn-sayhello">Ejecutar /sayHello</button>
        <p id="authorize-result"></p>

        <hr>

        <button id="btnMsg">Mostrar mensaje en el servidor</button>

    </body>

    <script>

    let userId = null;
    let key    = null;

    // ── Dominio ───────────────────────────────────────────────────────────────

    function getPrcaDominio()
    {
        return 'http://127.0.0.1:8080';
    }

    // ── Headers RPC ───────────────────────────────────────────────────────────

    function getRpcApiHeaders()
    {
        return {
            'Content-Type': 'application/json',
            'x-user-id':    userId,
            'x-api-key':    key
        };
    }

    // ── Clases de excepción ───────────────────────────────────────────────────

    class SpecificationError extends Error
    {
        constructor(detail) { super('SpecificationError'); this.detail = detail; }
    }

    class UnauthorizedError extends Error
    {
        constructor(detail) { super('UnauthorizedError'); this.detail = detail; }
    }

    class DomainError extends Error
    {
        constructor(detail) { super('DomainError'); this.detail = detail; }
    }

    class ServerError extends Error
    {
        constructor(detail) { super('ServerError'); this.detail = detail; }
    }

    // ── RPCWebAPIFetch ────────────────────────────────────────────────────────

    async function RPCWebAPIFetch(name, content)
    {
        try
        {
            const req = await fetch(getPrcaDominio() + '/' + name,
            {
                method:  'POST',
                headers: getRpcApiHeaders(),
                body:    JSON.stringify(content)
            });

            switch (req.status)
            {
                case 200: return await req.json();
                case 400: throw new SpecificationError(await req.json());
                case 401: throw new UnauthorizedError(await req.json());
                case 422: throw new DomainError(await req.json());
                case 500: throw new ServerError(await req.json());
                default:  throw new SpecificationError({ exception: 'UnexpectedStatus', detail: [req.status] });
            }
        }
        catch (err)
        {
            if (err instanceof SpecificationError ||
                err instanceof UnauthorizedError  ||
                err instanceof DomainError        ||
                err instanceof ServerError)
            {
                throw err;
            }
            throw new ServerError({ exception: 'NetworkError', detail: [err.message] });
        }
    }

    // ── Hash SHA256 ───────────────────────────────────────────────────────────

    async function calcularHashSHA256(cadena)
    {
        const encoder    = new TextEncoder();
        const data       = encoder.encode(cadena);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function(byte) { return byte.toString(16).padStart(2, '0'); }).join('');
    }

    // ── Eventos de los WebComponents ──────────────────────────────────────────

    document.addEventListener('login-submit', async function(e)
    {
        userId = e.detail.username;
        key    = await calcularHashSHA256(e.detail.password);

        try
        {
            const res = await RPCWebAPIFetch('login', {});

            if (res.session && res.session.status === 'enabled')
            {
                document.getElementById('active-user').innerText = userId;
                document.querySelector('wc-login-form-view').clearForm();
            }
        }
        catch (err)
        {
            console.error(err);
            if (err instanceof UnauthorizedError)
            {
                alert('Usuario o contraseña incorrectos.');
            }
            else
            {
                alert('Error: ' + err.message);
            }
        }
    });

    document.addEventListener('register-submit', async function(e)
    {
        userId = e.detail.nombre;
        key    = await calcularHashSHA256(e.detail.password);

        try
        {
            const res = await RPCWebAPIFetch('register', {});
            alert('Usuario creado: ' + res.username);
            document.querySelector('wc-register-form-view').clearForm();
        }
        catch (err)
        {
            console.error(err);
            alert('Error: ' + err.message);
        }
    });

    // ── Autorizador ───────────────────────────────────────────────────────────

    async function checkAuthorize(path)
    {
        if (!userId)
        {
            document.getElementById('authorize-result').innerText = 'Primero iniciá sesión.';
            return;
        }

        try
        {
            const res = await RPCWebAPIFetch('authorize', { path: path });
            document.getElementById('authorize-result').innerText =
                userId + (res.allowed ? ' tiene permiso sobre ' : ' NO tiene permiso sobre ') + path;
        }
        catch (err)
        {
            console.error(err);
            document.getElementById('authorize-result').innerText = 'Error: ' + err.message;
        }
    }

    function onBtnLogOnClick()      { checkAuthorize('/log');      }
    function onBtnSayHelloOnClick() { checkAuthorize('/sayHello'); }
    function onBtnMsgOnClick()      { RPCWebAPIFetch('showMessage', {}).catch(function(err) { console.error(err); }); }

    function main()
    {
        document.getElementById('btn-log').onclick      = onBtnLogOnClick;
        document.getElementById('btn-sayhello').onclick = onBtnSayHelloOnClick;
        document.getElementById('btnMsg').onclick       = onBtnMsgOnClick;
    }

    window.onload = main;

    </script>
</html>
